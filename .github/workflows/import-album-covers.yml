name: Import remaining Google Photos covers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-album-covers.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public Google Photos preview images
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request, urllib.parse, concurrent.futures, time
          from html.parser import HTMLParser
          from pathlib import Path

          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.values = {}
              def handle_starttag(self, tag, attrs):
                  if tag == 'meta':
                      a = dict(attrs)
                      key = a.get('property') or a.get('name') or a.get('itemprop')
                      if key and a.get('content'):
                          self.values.setdefault(key.lower(), a['content'])

          def approved(url, image=False):
              u = urllib.parse.urlsplit(url)
              if u.scheme != 'https' or u.username or u.password:
                  return False
              h = u.hostname or ''
              if image:
                  return h == 'googleusercontent.com' or h.endswith('.googleusercontent.com')
              return h in ('photos.app.goo.gl', 'goo.gl', 'photos.google.com')

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def __init__(self, image):
                  self.image = image
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not approved(newurl, self.image):
                      raise ValueError('Redirect outside permitted Google Photos hosts')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          def request(url, image=False):
              if not approved(url, image):
                  raise ValueError('Unapproved URL')
              req = urllib.request.Request(url, headers={'User-Agent':'Troop120Toolbox-CoverTest/1.0', 'Accept':'image/*' if image else 'text/html'})
              return urllib.request.build_opener(SafeRedirect(image)).open(req, timeout=12)

          source = Path('docs/albums-v15.js').read_text(encoding='utf-8')
          albums = json.loads(source.split('window.TROOP_PUBLIC_ALBUMS = ', 1)[1].strip().rstrip(';'))
          def probe(album):
              try:
                  with request(album['url']) as response:
                      final = response.geturl()
                      html = response.read(5_000_000).decode('utf-8', errors='replace')
                  meta = Meta()
                  meta.feed(html)
                  key = next((k for k in ('og:image:secure_url','og:image','twitter:image','twitter:image:src') if meta.values.get(k)), None)
                  if not key:
                      raise ValueError('No image metadata found')
                  url = urllib.parse.urljoin(final, meta.values[key])
                  if not approved(url, True):
                      raise ValueError('Unexpected image host')
                  with request(url, True) as img:
                      kind = img.headers.get_content_type()
                      prefix = img.read(65536)
                  if kind not in ('image/jpeg','image/png','image/webp','image/avif') or not prefix:
                      raise ValueError('No usable image data')
                  return album['url'], url, hashlib.sha256(prefix).hexdigest(), None
              except Exception as exc:
                  return album['url'], None, None, str(exc)[:120]
              finally:
                  time.sleep(0.5)

          covers = {}
          fingerprints = set()
          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for link, url, fingerprint, error in executor.map(probe, albums):
                  if url and fingerprint not in fingerprints:
                      covers[link] = url
                      fingerprints.add(fingerprint)
                  else:
                      failures.append({'album':link,'reason':error or 'Duplicate image fingerprint'})
          print(f'Unique candidates: {len(covers)}/{len(albums)}; unavailable or duplicate: {len(failures)}')
          for f in failures:
              print(f['album'], f['reason'])
          if not covers:
              raise SystemExit('No usable candidates; existing covers retained.')
          path = Path('docs/album-covers-v17.js')
          previous = {}
          if path.exists():
              previous = json.loads(path.read_text(encoding='utf-8').split('window.TROOP_ALBUM_COVERS = ',1)[1].strip().rstrip(';'))
          previous.update(covers)
          path.write_text('window.TROOP_ALBUM_COVERS = '+json.dumps(previous, ensure_ascii=True, indent=2)+';\n', encoding='utf-8')
          print(f'Total cover mappings: {len(previous)}')
          PY
      - name: Commit cover URL catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/album-covers-v17.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import Google Photos cover URL catalog"
          git push origin HEAD:main
